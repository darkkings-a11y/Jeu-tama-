name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Dezipper le projet
        run: |
          rm -rf projet
          mkdir projet
          unzip -q tamagotchi.zip -d projet
          ls -la projet

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Compiler l APK
        working-directory: projet
        run: gradle assembleDebug --no-daemon

      - name: Publier l APK
        uses: actions/upload-artifact@v4
        with:
          name: TamagotchiAPK
          path: projet/app/build/outputs/apk/debug/*.apk
